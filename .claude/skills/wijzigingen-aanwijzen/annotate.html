<style>
/* ================= aanwijs-laag =================================
   Ligt over de app heen. Uit staat hij volledig opzij: je gebruikt de app
   gewoon. Aan vangt hij elke tik op, zodat aanwijzen niet per ongeluk een
   knop indrukt -- de app eronder bevriest dan.

   Eén opdracht kan méér dan één plek hebben: een pijl hier, een cirkel daar.
   Ze delen hun nummer en hun kleur, zodat "zie punt 6" niet meer nodig is. */
.ann-vel{position:absolute;inset:0;z-index:60;pointer-events:none;overflow:hidden;}
.ann-vel.aan{pointer-events:auto;background:rgba(58,48,42,.045);cursor:crosshair;touch-action:none;}
.ann-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.ann-svg .lijn{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.ann-svg .kop{stroke:none;}
.ann-svg .pin-t{fill:#fff;font:700 15px ui-rounded,system-ui,sans-serif;
  text-anchor:middle;dominant-baseline:central;}
.ann-svg .pak{opacity:.35;}

/* ---- de balk onderin ---- */
.ann-bar{position:absolute;left:8px;right:8px;bottom:74px;z-index:62;
  display:flex;flex-direction:column;gap:7px;font:15px ui-rounded,system-ui,sans-serif;}
.ann-ger{display:none;gap:6px;}
.ann-bar.aan .ann-ger{display:flex;}
.ann-ger button{flex:1;min-width:0;background:#e7ded0;color:#3a302a;
  border:2px solid #b8a98f;border-radius:14px;padding:8px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font:600 11.5px ui-rounded,system-ui,sans-serif;line-height:1;
  box-shadow:0 2px 8px rgba(40,32,25,.16);}
.ann-ger button svg{width:21px;height:21px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ann-ger button[aria-pressed="true"]{background:#3a302a;color:#f2ead9;border-color:#3a302a;}
.ann-rij{display:flex;gap:7px;align-items:center;}
.ann-rij button{background:#e7ded0;color:#3a302a;border:2px solid #3a302a;
  border-radius:20px;padding:9px 15px;cursor:pointer;
  font:600 15px ui-rounded,system-ui,sans-serif;box-shadow:0 2px 10px rgba(40,32,25,.2);}
.ann-aan{margin-left:auto;}
.ann-bar.aan .ann-aan{background:#3a302a;color:#f2ead9;}
.ann-tel{background:#7d6650!important;color:#f2ead9!important;border-color:#7d6650!important;}
.ann-tel[hidden]{display:none;}
.ann-bij{display:none;align-items:center;gap:8px;background:#3a302a;color:#f2ead9;
  border-radius:14px;padding:8px 12px;font-size:14px;}
.ann-bij.op{display:flex;}
.ann-bij button{background:none;border:1.5px solid #f2ead9;color:#f2ead9;
  border-radius:10px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;margin-left:auto;}

/* ---- het overzicht ---- */
.ann-blad{position:absolute;inset:0;z-index:70;background:#efe9dd;color:#3a302a;
  display:none;flex-direction:column;font:16px/1.45 ui-rounded,system-ui,sans-serif;}
.ann-blad.op{display:flex;}
.ann-kop{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid #b8a98f;}
.ann-kop h2{font-size:20px;margin:0;flex:1;}
.ann-kop button{background:none;border:2px solid #b8a98f;border-radius:12px;
  padding:8px 13px;font:inherit;font-size:15px;color:#3a302a;cursor:pointer;}
.ann-lijst{flex:1;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch;}
.ann-item{display:grid;grid-template-columns:30px 1fr 24px;gap:9px;align-items:start;margin-bottom:14px;}
.ann-nr{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:2px;}
.ann-veld{min-width:0;}
.ann-plek{font-size:13px;color:#7a6c5e;margin-bottom:2px;}
.ann-item textarea{width:100%;min-height:42px;resize:none;overflow:hidden;
  background:#e7ded0;color:#3a302a;border:2px solid #b8a98f;border-radius:11px;
  padding:9px 10px;font:15.5px/1.35 ui-rounded,system-ui,sans-serif;}
.ann-item textarea:focus{outline:none;border-color:#7d6650;}
.ann-erbij{background:none;border:none;color:#7d6650;font:600 13.5px ui-rounded,system-ui,sans-serif;
  padding:5px 0 0;cursor:pointer;text-decoration:underline;}
.ann-weg{background:none;border:none;color:#7a6c5e;font-size:20px;cursor:pointer;padding:4px 0;}
.ann-leeg{color:#7a6c5e;}
.ann-voet{padding:12px 16px;border-top:2px solid #b8a98f;display:flex;gap:8px;}
.ann-voet button{flex:1;border-radius:13px;padding:12px;cursor:pointer;
  font:600 15px ui-rounded,system-ui,sans-serif;background:#7d6650;color:#f2ead9;border:2px solid #7d6650;}
.ann-voet .zacht{background:none;color:#3a302a;border-color:#b8a98f;font-weight:400;}
.ann-uit{width:100%;min-height:190px;background:#e7ded0;color:#3a302a;border:2px solid #b8a98f;
  border-radius:11px;padding:10px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre;overflow:auto;}
</style>

<script>
/* ================= aanwijzen in de app zelf ======================
   Waarom in de app en niet op een schermafbeelding: hier weet ik van elk
   punt op wélke pagina het staat en op welk element je wees.

   Eén opdracht, meerdere plekken: markeringen delen een nummer en een kleur.
   Daarmee vervalt het "zie punt 6" dat een opdracht over losse regels
   uitsmeerde.                                                            */
(function(){
  const phone=document.querySelector('.phone');
  if(!phone)return;
  if(getComputedStyle(phone).position==='static')phone.style.position='relative';

  const PALET=['#c0392b','#2c6e9b','#4a7c3f','#7a4b8c','#c97b1e'];
  const kleur=n=>PALET[(n-1)%PALET.length];

  let aan=false, gereed='pin', bijGroep=null, volgPag='';
  let marks=[];              // {grp,soort,pag,...maten,anker,anker2}
  let opdr=[];               // {n,tekst}
  let bezig=null, sleep=null, drukTimer=null, neer=null;

  const vel=document.createElement('div');vel.className='ann-vel';
  vel.innerHTML='<svg class="ann-svg"><g class="ann-shift"></g></svg>';
  const shift=vel.querySelector('.ann-shift');
  phone.appendChild(vel);

  const GEREEDSCHAP=[
    ['pin','aanwijzen','<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>'],
    ['pijl','pijl','<path d="M4 19 19 5"/><path d="M12.5 5H19v6.5"/>'],
    ['dubbel','dubbele pijl','<path d="M5 18 19 6"/><path d="M5 11.5V18h6.5"/><path d="M12.5 6H19v6.5"/>'],
    ['lijn','omcirkel','<path d="M16.5 6.4C20 8.6 20.4 13.6 17 16.4c-3.6 3-9.6 2.6-12-.9C3 12.3 4.6 7.7 8.6 6.2c2.6-1 5.6-.7 7.7.9"/>'],
  ];
  const bar=document.createElement('div');
  bar.className='ann-bar';
  bar.innerHTML=
    '<div class="ann-bij"><span class="bij-t"></span><button type="button" class="bij-uit">klaar</button></div>'+
    '<div class="ann-ger">'+GEREEDSCHAP.map(([id,lbl,svg])=>
      '<button type="button" data-g="'+id+'" aria-pressed="'+(id==='pin')+'">'+
      '<svg viewBox="0 0 24 24">'+svg+'</svg><span>'+lbl+'</span></button>').join('')+'</div>'+
    '<div class="ann-rij"><button type="button" class="ann-tel" hidden></button>'+
    '<button type="button" class="ann-aan">aanwijzen</button></div>';
  phone.appendChild(bar);
  const tel=bar.querySelector('.ann-tel'), aanKnop=bar.querySelector('.ann-aan');
  const bijBalk=bar.querySelector('.ann-bij'), bijTxt=bar.querySelector('.bij-t');

  const blad=document.createElement('div');
  blad.className='ann-blad';
  blad.innerHTML=
    '<div class="ann-kop"><h2>Wat er anders moet</h2><button class="dicht">terug</button></div>'+
    '<div class="ann-lijst"></div>'+
    '<div class="ann-voet"><button class="maak">maak de opdracht</button>'+
    '<button class="zacht wis">wis alles</button></div>';
  phone.appendChild(blad);
  const lijst=blad.querySelector('.ann-lijst');

  /* ---- welke pagina is in beeld? de app houdt dat zelf bij ---- */
  function huidigePag(){
    try{if(typeof currentPage==='string'&&currentPage)return currentPage;}catch(e){}
    const z=[...document.querySelectorAll('[id^="page-"]')].find(el=>!el.classList.contains('hidden'));
    return z?z.id.replace(/^page-/,''):'onbekend';
  }
  /* ---- waar wees je op? het label van het element eronder ----
     Het nuttigste stukje van de hele tool: "bij «＋ new brew»" is iets om mee
     te werken, een coördinaat niet. innerText en niet textContent -- die
     laatste plakt losse spans aan elkaar tot "surprise mea surprise brew". */
  function kort(s){s=(s||'').trim().replace(/\s+/g,' ');
    return s.length<=45?s:s.slice(0,42).trim()+'…';}
  function ankerOp(x,y){
    const stapel=document.elementsFromPoint(x,y)
      .filter(el=>!el.closest('.ann-vel,.ann-bar,.ann-blad'));
    let terugval='';
    for(const el of stapel){
      const aria=el.getAttribute&&(el.getAttribute('aria-label')||
                 el.getAttribute('placeholder')||el.getAttribute('title'));
      if(aria&&aria.trim())return kort(aria);
      const ruw=(typeof el.innerText==='string'?el.innerText:el.textContent)||'';
      const eerste=ruw.trim().split('\n')[0].trim();
      if(!eerste)continue;
      if(eerste.length<=45)return eerste;
      if(!terugval)terugval=kort(eerste);
    }
    return terugval;
  }
  /* ---- het scrollende vlak ----
     .phone staat op overflow:hidden en scrollt nooit. Wat wél scrollt is de
     .screen ván de pagina die in beeld is; elke pagina heeft een eigen.
     Rekenen tegen .phone laat de punten aan het scherm plakken.           */
  function actiefScherm(){
    const pag=document.getElementById('page-'+huidigePag());
    return (pag&&pag.querySelector('.screen'))||null;
  }
  function pos(e){
    const sc=actiefScherm(), r=(sc||phone).getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top+(sc?sc.scrollTop:0)};
  }
  function zetShift(){
    const sc=actiefScherm();
    if(!sc){shift.setAttribute('transform','translate(0,0)');return;}
    const pr=phone.getBoundingClientRect(), sr=sc.getBoundingClientRect();
    shift.setAttribute('transform',
      'translate('+(sr.left-pr.left)+','+(sr.top-pr.top-sc.scrollTop)+')');
  }
  phone.addEventListener('scroll',zetShift,{passive:true,capture:true});
  window.addEventListener('resize',zetShift);

  /* ---- tekenen ---- */
  function pijlKop(x1,y1,x2,y2,k){
    const a=Math.atan2(y2-y1,x2-x1), L=13;
    return '<path class="kop" fill="'+k+'" d="M'+x2+' '+y2+
      'L'+(x2-L*Math.cos(a-0.42))+' '+(y2-L*Math.sin(a-0.42))+
      'L'+(x2-L*Math.cos(a+0.42))+' '+(y2-L*Math.sin(a+0.42))+'Z"/>';
  }
  function tekenMark(m,vast){
    const k=kleur(m.grp), extra=vast?'':' class="pak"';
    if(m.soort==='pin'){
      const n=m.grp;
      return '<g'+extra+'><circle cx="'+m.x+'" cy="'+m.y+'" r="14" fill="'+k+'"/>'+
        '<text class="pin-t" x="'+m.x+'" y="'+m.y+'">'+n+'</text></g>';
    }
    if(m.soort==='lijn'){
      return '<g'+extra+'><polyline class="lijn" stroke="'+k+'" points="'+
        m.p.map(q=>q.x+','+q.y).join(' ')+'"/>'+etiket(m,k)+'</g>';
    }
    // pijl en dubbele pijl
    let s='<g'+extra+'><line class="lijn" stroke="'+k+'" x1="'+m.x+'" y1="'+m.y+
      '" x2="'+m.x2+'" y2="'+m.y2+'"/>'+pijlKop(m.x,m.y,m.x2,m.y2,k);
    if(m.soort==='dubbel')s+=pijlKop(m.x2,m.y2,m.x,m.y,k);
    return s+etiket(m,k)+'</g>';
  }
  // het nummer bij een pijl of cirkel, zodat je ziet bij welke opdracht hij hoort
  function etiket(m,k){
    let cx,cy;
    if(m.soort==='lijn'){
      const xs=m.p.map(q=>q.x), ys=m.p.map(q=>q.y);
      cx=(Math.min(...xs)+Math.max(...xs))/2; cy=Math.min(...ys)-4;
    }else{cx=(m.x+m.x2)/2; cy=(m.y+m.y2)/2;}
    return '<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="'+k+'"/>'+
      '<text class="pin-t" x="'+cx+'" y="'+cy+'" style="font-size:13px">'+m.grp+'</text>';
  }
  function verf(){
    const pag=huidigePag();
    let s=marks.filter(m=>m.pag===pag).map(m=>tekenMark(m,true)).join('');
    if(bezig&&bezig.pag===pag)s+=tekenMark(bezig,false);
    shift.innerHTML=s;
    zetShift();
    const n=opdr.length;
    tel.hidden=!n;
    tel.textContent=n+' punt'+(n===1?'':'en')+' ›';
  }

  /* ---- markeringen aanraken: lang indrukken = verschuiven ---- */
  function raakt(m,p){
    if(m.soort==='pin')return Math.hypot(m.x-p.x,m.y-p.y)<24;
    if(m.soort==='lijn')return m.p.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<18);
    const dx=m.x2-m.x, dy=m.y2-m.y, L2=dx*dx+dy*dy||1;
    let t=((p.x-m.x)*dx+(p.y-m.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
    return Math.hypot(m.x+t*dx-p.x, m.y+t*dy-p.y)<18;
  }
  function verplaats(m,dx,dy){
    if(m.soort==='lijn'){m.p.forEach(q=>{q.x+=dx;q.y+=dy;});return;}
    m.x+=dx;m.y+=dy;
    if(m.x2!=null){m.x2+=dx;m.y2+=dy;}
  }

  /* ---- een nieuwe markering opnemen ---- */
  function nieuwNummer(){
    const n=opdr.length?Math.max(...opdr.map(o=>o.n))+1:1;
    opdr.push({n,tekst:''});return n;
  }
  function voegToe(m,anker,anker2){
    m.grp=bijGroep||nieuwNummer();
    m.anker=anker||''; if(anker2)m.anker2=anker2;
    marks.push(m);
  }

  vel.addEventListener('pointerdown',e=>{
    if(!aan)return;
    vel.setPointerCapture(e.pointerId);
    const p=pos(e), pag=huidigePag();
    neer={x:e.clientX,y:e.clientY,p,anker:ankerOp(e.clientX,e.clientY)};
    // lang indrukken op een bestaande markering: verschuiven voor precisie
    const raak=marks.filter(m=>m.pag===pag).reverse().find(m=>raakt(m,p));
    if(raak){
      drukTimer=setTimeout(()=>{
        drukTimer=null; sleep={m:raak,vorig:p};
        try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}
      },380);
    }
    if(gereed!=='pin')bezig={soort:gereed,pag,grp:bijGroep||(opdr.length?Math.max(...opdr.map(o=>o.n))+1:1),
      x:p.x,y:p.y,x2:p.x,y2:p.y,p:[p]};
  });
  vel.addEventListener('pointermove',e=>{
    if(!aan)return;
    const p=pos(e);
    if(sleep){verplaats(sleep.m,p.x-sleep.vorig.x,p.y-sleep.vorig.y);sleep.vorig=p;verf();return;}
    if(drukTimer&&Math.hypot(e.clientX-neer.x,e.clientY-neer.y)>8){clearTimeout(drukTimer);drukTimer=null;}
    if(!bezig)return;
    if(bezig.soort==='lijn')bezig.p.push(p); else {bezig.x2=p.x;bezig.y2=p.y;}
    verf();
  });
  ['pointerup','pointercancel'].forEach(ev=>vel.addEventListener(ev,e=>{
    if(!aan)return;
    if(drukTimer){clearTimeout(drukTimer);drukTimer=null;}
    if(sleep){sleep=null;bezig=null;verf();return;}
    const b=bezig; bezig=null;
    const ver=Math.hypot(e.clientX-neer.x,e.clientY-neer.y);
    if(gereed==='pin'){
      if(ver<14)voegToe({soort:'pin',pag:huidigePag(),x:neer.p.x,y:neer.p.y},neer.anker);
    }else if(b){
      const goed=(b.soort==='lijn')?b.p.length>3:ver>18;
      if(goed){
        delete b.grp;
        voegToe(b,neer.anker,(b.soort==='lijn')?'':ankerOp(e.clientX,e.clientY));
      }
    }
    verf();
  }));

  /* ---- knoppen ---- */
  aanKnop.addEventListener('click',()=>{
    aan=!aan;
    vel.classList.toggle('aan',aan);
    bar.classList.toggle('aan',aan);
    aanKnop.textContent=aan?'klaar':'aanwijzen';
    if(!aan)stopBij();
  });
  bar.querySelector('.ann-ger').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    gereed=b.dataset.g;
    bar.querySelectorAll('.ann-ger button').forEach(x=>
      x.setAttribute('aria-pressed',x===b?'true':'false'));
  });
  function startBij(n){
    bijGroep=n; bijBalk.classList.add('op');
    bijTxt.textContent='je voegt plekken toe aan punt '+n;
    blad.classList.remove('op');
    if(!aan)aanKnop.click();
  }
  function stopBij(){bijGroep=null;bijBalk.classList.remove('op');}
  bar.querySelector('.bij-uit').addEventListener('click',stopBij);
  tel.addEventListener('click',()=>{toonLijst();blad.classList.add('op');});
  blad.querySelector('.dicht').addEventListener('click',()=>blad.classList.remove('op'));
  blad.querySelector('.wis').addEventListener('click',()=>{
    if(marks.length&&!confirm('Alle punten en tekeningen wissen?'))return;
    marks=[];opdr=[];stopBij();verf();toonLijst();
  });

  /* ---- het overzicht: per opdracht, met al zijn plekken ---- */
  const SOORT={pin:'aangewezen',pijl:'pijl',dubbel:'dubbele pijl',lijn:'omcirkeld'};
  function plekTekst(m){
    if(m.soort==='dubbel'&&m.anker&&m.anker2)return 'verbindt «'+m.anker+'» ↔ «'+m.anker2+'»';
    if(m.soort==='pijl'&&m.anker&&m.anker2)return 'van «'+m.anker+'» naar «'+m.anker2+'»';
    if(m.anker)return (m.soort==='lijn'?'omcirkeld bij ':'bij ')+'«'+m.anker+'»';
    return SOORT[m.soort]+' op deze pagina';
  }
  function groei(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
  function toonLijst(){
    if(!opdr.length){
      lijst.innerHTML='<p class="ann-leeg">Nog niets aangewezen. Zet <b>aanwijzen</b> aan, '+
        'kies gereedschap en tik of sleep op wat er anders moet. '+
        'Hoort iets bij een punt dat er al staat, gebruik dan <i>+ nog een plek</i>.</p>';
      return;
    }
    lijst.innerHTML=opdr.map(o=>{
      const mijn=marks.filter(m=>m.grp===o.n);
      const paginas=[...new Set(mijn.map(m=>m.pag))];
      return '<div class="ann-item"><span class="ann-nr" style="background:'+kleur(o.n)+'">'+o.n+'</span>'+
        '<div class="ann-veld">'+
        mijn.map(m=>'<div class="ann-plek">'+esc2(plekTekst(m))+
          (paginas.length>1?' <i>('+m.pag+')</i>':'')+'</div>').join('')+
        '<textarea rows="1" placeholder="wat moet hier anders?" data-n="'+o.n+'"></textarea>'+
        '<button class="ann-erbij" data-n="'+o.n+'">+ nog een plek</button>'+
        '</div><button class="ann-weg" data-n="'+o.n+'">×</button></div>';
    }).join('');
    lijst.querySelectorAll('textarea').forEach(t=>{
      const o=opdr.find(x=>x.n===+t.dataset.n);
      t.value=o.tekst||'';groei(t);
      t.addEventListener('input',()=>{o.tekst=t.value;groei(t);});
    });
    lijst.querySelectorAll('.ann-erbij').forEach(b=>
      b.addEventListener('click',()=>startBij(+b.dataset.n)));
    lijst.querySelectorAll('.ann-weg').forEach(b=>b.addEventListener('click',()=>{
      const n=+b.dataset.n;
      marks=marks.filter(m=>m.grp!==n); opdr=opdr.filter(o=>o.n!==n);
      verf();toonLijst();
    }));
  }
  function esc2(s){return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

  /* ---- de opdracht ---- */
  blad.querySelector('.maak').addEventListener('click',()=>{
    let s='Opdracht voor Lets Brew — '+opdr.length+' punt'+(opdr.length===1?'':'en')+'\n';
    const perPag={};
    opdr.forEach(o=>{
      const mijn=marks.filter(m=>m.grp===o.n);
      const pag=(mijn[0]&&mijn[0].pag)||'onbekend';
      (perPag[pag]=perPag[pag]||[]).push(o);
    });
    Object.keys(perPag).forEach(pag=>{
      s+='\n── '+pag+' ──\n';
      perPag[pag].forEach(o=>{
        const mijn=marks.filter(m=>m.grp===o.n);
        s+=o.n+'. '+mijn.map(m=>plekTekst(m)+
             (m.pag!==pag?(' [op '+m.pag+']'):'')).join('\n   + ')+'\n';
        s+='   '+((o.tekst||'').trim()||'(nog geen uitleg)')+'\n';
      });
    });
    lijst.innerHTML='<p class="ann-leeg" style="margin-bottom:9px">Kopieer dit en plak het in de chat:</p>'+
      '<textarea class="ann-uit" readonly></textarea>';
    lijst.querySelector('.ann-uit').value=s;
    const voet=blad.querySelector('.ann-voet');
    voet.innerHTML='<button class="kopie">kopieer</button><button class="zacht terug">terug naar de lijst</button>';
    voet.querySelector('.kopie').addEventListener('click',async()=>{
      const k=voet.querySelector('.kopie');
      try{await navigator.clipboard.writeText(s);k.textContent='gekopieerd ✓';}
      catch(e){const ta=lijst.querySelector('.ann-uit');
        ta.removeAttribute('readonly');ta.select();
        try{document.execCommand('copy');k.textContent='gekopieerd ✓';}
        catch(e2){k.textContent='selecteer en kopieer met de hand';}
        ta.setAttribute('readonly','');}
    });
    voet.querySelector('.terug').addEventListener('click',()=>{
      voet.innerHTML='<button class="maak">maak de opdracht</button>'+
        '<button class="zacht wis">wis alles</button>';
      location.reload();
    });
  });

  /* ---- haakje voor de testronde; zie references/onderhoud.md ---- */
  window.__ann={
    marks:()=>marks, opdr:()=>opdr,
    kies:g=>{gereed=g;bar.querySelectorAll('.ann-ger button').forEach(x=>
      x.setAttribute('aria-pressed',x.dataset.g===g?'true':'false'));},
  };

  /* ---- de app wisselt van pagina: dan andere markeringen tonen ---- */
  setInterval(()=>{const p=huidigePag();if(p!==volgPag){volgPag=p;verf();}},220);
  verf();
})();
</script>
