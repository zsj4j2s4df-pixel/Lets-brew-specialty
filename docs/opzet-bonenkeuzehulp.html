<style>
/* Werkend prototype: één telefoon die het hele scherm vult. */
body{padding:0;background:var(--desk);display:flex;justify-content:center;
  height:100vh;height:100dvh;overflow:hidden;}
.mk-wrap{max-width:430px;width:100%;margin:0;}
.phone{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--paper);
  border:none;border-radius:0;display:flex;flex-direction:column;overflow:hidden;filter:none;}
.screen{flex:1;min-height:0;overflow-y:auto;padding:0 20px 24px;-webkit-overflow-scrolling:touch;}
.screen::-webkit-scrollbar{display:none;}

.kop-rij{display:flex;align-items:baseline;gap:9px;margin:4px 0 2px;}
.kop-rij .t{font-family:'Caveat',cursive;font-size:31px;line-height:1;flex:1;}
.terug{background:none;border:none;color:var(--ink-soft);font:inherit;font-size:15px;
  padding:4px 0;cursor:pointer;}
.kruimel{font-size:13.5px;color:var(--ink-soft);margin-bottom:8px;}
.kruimel b{color:var(--ink);}
.kruimel button{background:none;border:none;font:inherit;color:var(--ink-soft);
  text-decoration:underline;cursor:pointer;padding:0;}

/* ---- de kaart ---- */
.kaart-doos{position:relative;background:var(--card-2);border:2px solid var(--ink);
  border-radius:20px;overflow:hidden;filter:url(#wobble);margin-bottom:10px;}
.kaart{width:100%;height:250px;display:block;touch-action:manipulation;}
.kaart .zee{fill:var(--card-2);}
.kaart .band{fill:var(--v60);opacity:.45;}
.kaart .lijn{stroke:var(--line);stroke-width:.5;fill:none;stroke-dasharray:3 3;
  vector-effect:non-scaling-stroke;}
.kaart .lijn.eq{stroke-dasharray:none;opacity:.7;}
.kaart .achter{fill:var(--desk);stroke:var(--line);stroke-width:1;opacity:.5;
  stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none;}
.kaart .land{fill:var(--card);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .2s;}
.kaart .land.uit{fill:var(--desk);stroke:var(--line);opacity:.6;cursor:default;}
.kaart .land.had{fill:var(--accent-soft);fill-opacity:.45;}
.kaart .land.sel{fill:var(--v60);fill-opacity:1;stroke:var(--ink);stroke-width:2.6;}
.kaart .lbl{font-family:'Patrick Hand',cursive;fill:var(--ink-soft);
  pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:var(--paper);
  stroke-linejoin:round;}
.kaart .lbl.groot{font-family:'Caveat',cursive;fill:var(--ink);}
.kaart .lbl.wit{fill:var(--cream);}
.kaart .stip{fill:var(--paper);stroke:var(--ink);stroke-width:1.6;
  vector-effect:non-scaling-stroke;cursor:pointer;}
.kaart .stip.sel{fill:var(--accent-soft);stroke:var(--ink);}
.kaart .nr{font-family:'Patrick Hand',cursive;fill:var(--ink);text-anchor:middle;
  cursor:pointer;}
.kaart .nr.aan{fill:var(--cream);}
.kaart-tip{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;font-size:13px;
  color:var(--ink-soft);background:linear-gradient(transparent,var(--card-2) 55%);
  text-align:center;pointer-events:none;}

/* ---- informatiekaarten ---- */
.blok{background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:12px 15px;margin-bottom:11px;filter:url(#wobble);}
.blok.vol{border-color:var(--ink);}
.blok h3{font-family:'Caveat',cursive;font-size:25px;font-weight:700;line-height:1.05;
  margin-bottom:3px;}
.blok .onder{color:var(--ink-soft);font-size:14px;margin-bottom:7px;}
.blok p{font-size:15.5px;line-height:1.45;margin-bottom:8px;}
.blok p:last-child{margin-bottom:0;}
.etiket{font-size:12.5px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--ink-soft);margin:11px 0 5px;}
.smaakrij{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px;}
.smaak{background:var(--card-2);border:1.5px solid var(--line);border-radius:13px;
  padding:3px 10px;font-size:14px;}
.proc{border-top:1.5px dashed var(--line);padding:8px 0 2px;}
.proc:first-of-type{border-top:none;}
.proc .n{font-size:16px;}
.proc .n em{font-style:normal;color:var(--ink-soft);font-size:13.5px;margin-left:5px;}
.proc .u{color:var(--ink-soft);font-size:14.5px;line-height:1.4;}
.proc .u b{color:var(--ink);font-weight:400;}
.kies{display:block;width:100%;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:18px;padding:9px 13px;margin-bottom:8px;
  font:inherit;color:var(--ink);cursor:pointer;filter:url(#wobble);}
.kies:last-child{margin-bottom:0;}
.kies.sel{background:var(--card-2);border-color:var(--ink);}
.kies .k1{font-size:16.5px;}
.kies .bol{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;border:1.6px solid var(--ink);
  font-size:13.5px;margin-right:8px;vertical-align:-4px;}
.kies.sel .bol{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--cream);}
.kies .k1 em{font-style:normal;color:var(--ink-soft);font-size:13.5px;margin-left:6px;}
.kies .k2{display:block;color:var(--ink-soft);font-size:14px;line-height:1.35;margin-top:2px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:var(--card);color:var(--ink);border:2px solid var(--line);
  border-radius:15px;padding:5px 12px;font:inherit;font-size:15px;cursor:pointer;
  filter:url(#wobble);}
.chip.sel{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--cream);}
.knop{display:block;width:100%;text-align:center;background:var(--accent-soft);
  color:var(--cream);border:2px solid var(--accent-soft);border-radius:20px;
  padding:12px;font:inherit;font-size:17px;cursor:pointer;filter:url(#wobble);
  margin-top:4px;}
.zak{border:2px dashed var(--line);border-radius:16px;padding:10px 13px;font-size:15px;
  line-height:1.6;}
.zak em{font-style:normal;color:var(--ink-soft);display:inline-block;min-width:78px;}
.zoekbalk{display:flex;gap:7px;background:var(--card-2);border:2px solid var(--line);
  border-radius:16px;padding:9px 12px;font-size:14.5px;color:var(--ink-soft);margin-top:9px;}
.zacht{color:var(--ink-soft);font-size:14px;line-height:1.4;}
.legenda{display:flex;gap:14px;justify-content:center;font-size:12.5px;
  color:var(--ink-soft);margin:-4px 0 10px;}
.legenda span{display:flex;align-items:center;gap:5px;}
.legenda i{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--ink);
  display:inline-block;background:var(--card);}
.legenda i.had{background:#c3ad91;}
.uitleg-let{background:var(--card-2);border-radius:14px;padding:9px 12px;
  font-size:14px;line-height:1.45;color:var(--ink-soft);margin-bottom:11px;}
.uitleg-let b{color:var(--ink);font-weight:400;}
</style>

/* ---- de kaart tekenen ---- */
function pad(l){return 'M'+l.pts.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('L')+'Z';}
function doos(lijst,marge){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  lijst.forEach(l=>l.pts.forEach(p=>{
    const x=X(p[0]),y=Y(p[1]);
    if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
  }));
  const m=marge||0;
  return [x0-m,y0-m,(x1-x0)+m*2,(y1-y0)+m*2];
}
/* Het kijkvenster oprekken tot het dezelfde verhouding heeft als het kader,
   anders staat er links en rechts (of boven en onder) een brede lege rand. */
const VERH=1.4;
function opVerhouding(b){
  let [x,y,w,h]=b;
  if(w/h<VERH){const nw=h*VERH;x-=(nw-w)/2;w=nw;}
  else{const nh=w/VERH;y-=(nh-h)/2;h=nh;}
  return [x,y,w,h];
}
const VIEWS={
 wereld:opVerhouding(doos(LANDEN,8)),
 amerika:opVerhouding(doos(LANDEN.filter(l=>l.deel==='amerika'),5)),
 afrika:opVerhouding(doos(LANDEN.filter(l=>l.deel==='afrika'),5)),
 azie:opVerhouding(doos(LANDEN.filter(l=>l.deel==='azie'),5)),
};
/* Op landniveau zoomen we niet op het hele land maar op het teeltgebied.
   De streken van Kenia liggen binnen één graad van elkaar; op de schaal van
   het hele land vallen hun namen boven op elkaar. */
function landView(id){
  const st=(INFO[id]&&INFO[id].streken)||[];
  if(!st.length)return opVerhouding(doos([KAART_LAND[id]],4));
  const xs=st.map(a=>X(a.ll[0])), ys=st.map(a=>Y(a.ll[1]));
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const m=Math.max((x1-x0)*0.45,(y1-y0)*0.45,2.6);
  return opVerhouding([x0-m,y0-m,(x1-x0)+m*2,(y1-y0)+m*2]);
}

let huidigeView=VIEWS.wereld.slice(), tweenId=null;
/* Het kijkvenster schuift en zoomt in plaats van te springen, zodat je ziet
   waar je naartoe gaat. De <svg> wordt tussendoor opnieuw opgebouwd, dus we
   zoeken hem elk beeldje opnieuw op -- vasthouden aan de oude gaat mis. */
function pasVenster(){
  const svg=document.querySelector('.kaart'); if(!svg)return;
  svg.setAttribute('viewBox',huidigeView.map(n=>n.toFixed(2)).join(' '));
  pasMaten(svg);
}
/* Tekst en stippen staan in kaart-eenheden, maar moeten op het scherm altijd
   even groot zijn. Hoeveel schermpixels één eenheid is hangt van de zoom af,
   dus rekenen we dat hier na elke stap terug.                              */
function pasMaten(svg){
  const r=svg.getBoundingClientRect();
  if(!r.width)return;
  const v=huidigeView, s=Math.min(r.width/v[2], r.height/v[3]);
  if(!(s>0))return;
  svg.querySelectorAll('.lbl').forEach(t=>{
    t.style.fontSize=((t.classList.contains('groot')?15.5:11.5)/s)+'px';
    t.style.strokeWidth=(2.8/s)+'px';   // randje papier eromheen, anders valt
  });                                   // een naam weg tegen de landsgrens
  svg.querySelectorAll('.stip').forEach(c=>c.setAttribute('r',(9/s).toFixed(2)));
  svg.querySelectorAll('.nr').forEach(t=>{
    t.style.fontSize=(11/s)+'px';
    t.setAttribute('dy',(3.8/s));
  });
  spreidStippen(svg,s);
}
/* Twee streken kunnen vijftien kilometer uit elkaar liggen. Op een telefoon
   vallen hun stippen dan over elkaar en kun je de achterste niet aantikken.
   Daarom duwen we ze net zo ver uit elkaar dat je ze allebei raakt -- een
   paar kilometer scheef, en dat mag: dit is een tekening, geen atlas. */
function spreidStippen(svg,s){
  const st=[...svg.querySelectorAll('.stip')];
  if(st.length<2)return;
  const min=27/s;
  const pos=st.map(c=>({x:+c.dataset.x0,y:+c.dataset.y0}));
  for(let ronde=0;ronde<40;ronde++){
    let bewogen=false;
    for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){
      let dx=pos[j].x-pos[i].x, dy=pos[j].y-pos[i].y, d=Math.hypot(dx,dy);
      if(d<1e-6){dx=min/2;dy=0;d=min/2;}
      if(d<min){
        const duw=(min-d)/(2*d);
        pos[i].x-=dx*duw; pos[i].y-=dy*duw;
        pos[j].x+=dx*duw; pos[j].y+=dy*duw;
        bewogen=true;
      }
    }
    if(!bewogen)break;
  }
  st.forEach((c,i)=>{c.setAttribute('cx',pos[i].x);c.setAttribute('cy',pos[i].y);});
  svg.querySelectorAll('.nr').forEach(t=>{
    const p=pos[+t.dataset.i]; if(!p)return;
    t.setAttribute('x',p.x); t.setAttribute('y',p.y);
  });
  const naam=svg.querySelector('.lbl.groot[data-i]');
  if(naam){
    const p=pos[+naam.dataset.i];
    if(p){naam.setAttribute('x',p.x); naam.setAttribute('y',p.y-(15/s));}
  }
}
function zetView(doelw){
  if(tweenId)cancelAnimationFrame(tweenId);
  const van=huidigeView.slice(), naar=doelw.slice();
  const t0=performance.now(), duur=520;
  (function stap(nu){
    const f=Math.min(1,(nu-t0)/duur);
    const e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;      // rustig op gang, rustig uit
    huidigeView=van.map((v,i)=>v+(naar[i]-v)*e);
    pasVenster();
    if(f<1)tweenId=requestAnimationFrame(stap); else tweenId=null;
  })(t0);
}

function kaartHTML(){
  const v=huidigeView;
  let s='<svg class="kaart" viewBox="'+v.join(' ')+'" preserveAspectRatio="xMidYMid meet">';
  s+='<rect class="zee" x="-200" y="-200" width="500" height="400"/>';
  s+='<rect class="band" x="-200" y="'+Y(23.5)+'" width="500" height="'+(Y(-23.5)-Y(23.5))+'"/>';
  s+='<line class="lijn" x1="-200" y1="'+Y(23.5)+'" x2="300" y2="'+Y(23.5)+'"/>';
  s+='<line class="lijn eq" x1="-200" y1="0" x2="300" y2="0"/>';
  s+='<line class="lijn" x1="-200" y1="'+Y(-23.5)+'" x2="300" y2="'+Y(-23.5)+'"/>';
  ACHTER.forEach(pl=>{
    s+='<path class="achter" d="M'+pl.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('L')+'Z"/>';
  });
  TEKENVOLGORDE.forEach(l=>{
    let kl='land';
    if(niv==='wereld'){ if(GEHAD.includes(l.id))kl+=' had'; }
    else if(l.deel!==deel)kl+=' uit';
    else if(l.id===land)kl+=' sel';
    else if(GEHAD.includes(l.id))kl+=' had';
    const klik=(niv==='wereld')?("kies('deel','"+l.deel+"')")
              :(l.deel===deel&&INFO[l.id]?("kies('land','"+l.id+"')"):'');
    s+='<path class="'+kl+'" d="'+pad(l)+'"'+(klik?(' onclick="'+klik+'"'):'')+'></path>';
  });
  // opschriften: op wereldniveau de werelddelen, daarbinnen de landnamen
  if(niv==='wereld'){
    [['amerika',-62,27],['afrika',22,27],['azie',112,27]].forEach(([d,lo,la])=>{
      s+='<text class="lbl groot" x="'+X(lo)+'" y="'+Y(la)+'">'+DELEN[d].kort+'</text>';
    });
  }else if(niv==='deel'){
    LANDEN.filter(l=>l.deel===deel).forEach(l=>{
      const c=middel(l), o=LABELPLEK[l.id]||[0,0];
      s+='<text class="lbl" x="'+(+c[0]+o[0])+'" y="'+(+c[1]+o[1])+'">'+l.naam+'</text>';
    });
  }else{
    const inf=INFO[land];
    // om en om boven en onder de stip, zodat namen die dicht bij elkaar
    // liggen elkaar niet overschrijven
    /* Streken liggen soms binnen een halve graad van elkaar -- vier namen
       naast elkaar wordt dan onleesbaar. Daarom krijgen de stippen een
       nummer dat terugkomt in de lijst eronder, en zie je alleen de naam
       van de streek die je hebt aangetikt. */
    (inf.streken||[]).forEach((st,i)=>{
      const x=X(st.ll[0]), y=Y(st.ll[1]), aan=streek===i;
      s+='<circle class="stip'+(aan?' sel':'')+'" cx="'+x+'" cy="'+y+
        '" r="1" data-x0="'+x+'" data-y0="'+y+'" onclick="kies(\'streek\','+i+')"></circle>';
      s+='<text class="nr'+(aan?' aan':'')+'" x="'+x+'" y="'+y+'" data-i="'+i+
        '" onclick="kies(\'streek\','+i+')">'+(i+1)+'</text>';
      if(aan)s+='<text class="lbl groot" x="'+x+'" y="'+y+'" data-i="'+i+
        '" data-r="-1">'+st.n+'</text>';
    });
  }
  s+='</svg>';
  return s;
}
/* Een paar landen zijn zo klein dat hun naam over de buren valt. Die duwen
   we een stukje weg; de maat is in kaart-eenheden, dus hij schaalt mee. */
const LABELPLEK={rwanda:[-4.5,-2.5],burundi:[-4.5,3],oeganda:[0,-3.5],congo:[-4,3],
  tanzania:[1.5,2.5],kenia:[2,0],costarica:[-3,4],panama:[5,3.5],honduras:[1,-3],
  nicaragua:[3,1],java:[0,4.5],sulawesi:[6,0.5],ecuador:[-4,0]};
function middel(l){
  let sx=0,sy=0;
  l.pts.forEach(p=>{sx+=X(p[0]);sy+=Y(p[1]);});
  return [(sx/l.pts.length).toFixed(1),(sy/l.pts.length).toFixed(1)];
}

    '<div class="etiket">de streken</div>'+
    (inf.streken||[]).map((st,i)=>
      '<button class="kies'+(streek===i?' sel':'')+'" onclick="kies(\'streek\','+i+')">'+
      '<span class="k1"><span class="bol">'+(i+1)+'</span>'+st.n+'</span>'+
      '<span class="k2">'+st.s.join(' · ')+'</span></button>').join('')+
    (streek!=null?streekBlok():'');
}
function streekBlok(){
  const inf=INFO[land], st=inf.streken[streek], L=KAART_LAND[land];
  const proc=kProc||inf.proc[0], br=kBrand||'light', me=kMeth||'v60';
  return '<div class="blok vol" style="margin-top:12px"><h3>'+st.n+'</h3>'+
    '<p>'+st.t+'</p>'+smaakRij(st.s)+'</div>'+
    '<div class="blok"><h3>hoe wil je hem hebben?</h3>'+
    '<div class="etiket">proces</div><div class="chips">'+
    inf.proc.map(p=>'<button class="chip'+(p===proc?' sel':'')+'" onclick="zet(\'proc\',\''+p+'\')">'+p+'</button>').join('')+
    '</div><p class="zacht" style="margin-top:7px">'+PROCES[proc].u+' Dat geeft een smaak die '+
    PROCES[proc].sm+', en een mondgevoel dat '+PROCES[proc].mo+' is.</p>'+
    '<div class="etiket">branding</div><div class="chips">'+
    Object.keys(BRAND).map(b=>'<button class="chip'+(b===br?' sel':'')+'" onclick="zet(\'brand\',\''+b+'\')">'+b+'</button>').join('')+
    '</div><p class="zacht" style="margin-top:7px">'+BRAND[br].t+'</p>'+
    '<div class="etiket">waar zet je hem</div><div class="chips">'+
    METHODES.map(m=>'<button class="chip'+(m===me?' sel':'')+'" onclick="zet(\'meth\',\''+m+'\')">'+m+'</button>').join('')+
    '</div><p class="zacht" style="margin-top:7px">'+methodeTip(me,br)+'</p></div>'+
    '<div class="blok vol"><h3>waar je op let bij de zak</h3>'+
    '<div class="zak">'+
    '<em>land</em> '+L.naam+'<br>'+
    '<em>streek</em> '+st.n+'<br>'+
    '<em>proces</em> '+proc+'<br>'+
    '<em>branding</em> '+br+'<br>'+
    '<em>smaak</em> '+st.s.join(', ')+'<br>'+
    '<em>gebrand</em> korter dan 3 weken geleden</div>'+
    '<div class="zoekbalk">🔍 '+L.naam+' '+st.n+' '+proc+' '+(br==='light'?'filter':me)+' specialty</div>'+
    '<p class="zacht" style="margin-top:8px">In de app wordt dit een echte zoekopdracht langs de '+
    'branders die jij zelf hebt opgeslagen. Wat er vandaag op hun plank ligt weet de app niet — '+
    'dat laatste klikje blijft van jou.</p>'+
    '<button class="knop" onclick="opLijst()">zet op mijn lijstje</button></div>';
}
function methodeTip(m,br){
  if(m==='espresso')return br==='light'
    ? 'Een light gebrande boon op espresso vraagt fijner malen dan je gewend bent, en het zuur wordt scherper. Mooi als het lukt, maar reken op een paar shots afstellen.'
    : 'Op espresso komt hier vooral het zoete en de body naar voren. Makkelijk af te stellen.';
  if(m==='aeropress')return 'De AeroPress vergeeft veel: kortere contacttijd, dus zuur blijft zacht. Een fijne manier om een nieuwe boon te leren kennen.';
  if(m==='chemex')return 'Het dikke filter houdt olie tegen. Dat geeft een heldere, bijna theeachtige kop — mooi bij bloemige koffie.';
  return 'De v60 laat het meest van de herkomst horen. Voor een boon waar je nieuwsgierig naar bent is dit de eerlijkste keuze.';
}

/* ---- klikken ---- */
window.kies=function(wat,waarde){
  if(wat==='deel'){deel=waarde;land=null;streek=null;niv='deel';zetView(VIEWS[deel]);}
  else if(wat==='land'){
    if(!INFO[waarde])return;
    land=waarde;streek=null;kProc=null;niv='land';zetView(landView(land));
  }else if(wat==='streek'){
    streek=(streek===waarde)?null:waarde;
  }
  teken(wat==='streek');
};
window.terug=function(){
  if(niv==='land'){niv='deel';land=null;streek=null;zetView(VIEWS[deel]);}
  else if(niv==='deel'){niv='wereld';deel=null;zetView(VIEWS.wereld);}
  teken();
};
window.zet=function(k,v){
  if(k==='proc')kProc=v; else if(k==='brand')kBrand=v; else kMeth=v;
  teken(true);
};
window.opLijst=function(){
  const st=INFO[land].streken[streek];
  const b=document.querySelector('.knop');
  b.textContent='✓ staat op je lijstje';
  b.style.background='var(--card-2)';b.style.color='var(--ink)';
  b.style.borderColor='var(--line)';
};

/* ---- tekenen ---- */
function teken(behoudScroll){
  const el=document.getElementById('scherm');
  const y=behoudScroll?el.scrollTop:0;
  el.innerHTML=(niv==='wereld')?schermWereld():(niv==='deel'?schermDeel():schermLand());
  el.scrollTop=y;
  pasVenster();
}
window.addEventListener('resize',()=>{const s=document.querySelector('.kaart');if(s)pasMaten(s);});
teken();
})();
</script>
